name: publish pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example, 0.13.4)"
        required: true
        type: string

jobs:
  publish-turu-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu-core
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  publish-turu-sqlite3:
    runs-on: ubuntu-latest
    needs: publish-turu-core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu-sqlite3
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  publish-turu-mysql:
    runs-on: ubuntu-latest
    needs: publish-turu-core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu-mysql
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  publish-turu-postgres:
    runs-on: ubuntu-latest
    needs: publish-turu-core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu-postgres
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  publish-turu-snowflake:
    runs-on: ubuntu-latest
    needs: publish-turu-core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu-snowflake
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  publish-turu-bigquery:
    runs-on: ubuntu-latest
    needs: publish-turu-core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu-bigquery
          pypi-token: ${{ secrets.PYPI_TOKEN }}

  publish-turu:
    runs-on: ubuntu-latest
    needs:
      - publish-turu-core
      - publish-turu-sqlite3
      - publish-turu-mysql
      - publish-turu-postgres
      - publish-turu-snowflake
      - publish-turu-bigquery
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/publish-pypi
        with:
          package: turu
          pypi-token: ${{ secrets.PYPI_TOKEN }}
