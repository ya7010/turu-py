# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-each-package:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        package:
          - { name: turu-core, path: turu-core }
          - { name: turu-sqlite3, path: turu-sqlite3 }
          - { name: turu-mysql, path: turu-mysql }
          - { name: turu-postgres, path: turu-postgres }
          - { name: turu-snowflake, path: turu-snowflake }
          - { name: turu-bigquery, path: turu-bigquery }
          - { name: turu, path: . }
        extras: ["", "--all-extras"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --package "${{ matrix.package.name }}" ${{ matrix.extras }}
      - name: Format
        working-directory: ${{ matrix.package.path }}
        run: uv run --locked task format --diff
      - name: Lint
        working-directory: ${{ matrix.package.path }}
        run: uv run --locked task lint --diff --output-format=github
      - name: Typecheck
        working-directory: ${{ matrix.package.path }}
        run: uv run --locked task typecheck
      - name: Test
        working-directory: ${{ matrix.package.path }}
        run: uv run --locked task test

  test:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [test-each-package]
    steps:
      - run: "[[ ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }} = false ]]"
