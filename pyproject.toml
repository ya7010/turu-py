[tool.poetry]
name = "turu"
version = "0.1.0"
description = "Simple Typed Python Database Client based PEP 249"
authors = ["yassun7010 <yassun7010@outlook.com>"]
readme = "README.md"
repository = "https://github.com/ya7010/turu-py"
documentation = "https://ya7010.github.io/turu-py/"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.extras]
sqlite3 = ["turu-sqlite3"]
mysql = ["turu-mysql"]
postgres = ["turu-postgres"]
snowflake = ["turu-snowflake"]
bigquery = ["turu-bigquery"]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.dependencies.turu-core]
# INFO: poetry-dynamic-versioning to replace this.
path = "./turu-core"
develop = true
# version = "0.0.0"

[tool.poetry.dependencies.turu-sqlite3]
# INFO: poetry-dynamic-versioning to replace this.
path = "./turu-sqlite3"
develop = true
# version = "0.0.0"
optional = true

[tool.poetry.dependencies.turu-mysql]
# INFO: poetry-dynamic-versioning to replace this.
path = "./turu-mysql"
develop = true
# version = "0.0.0"
optional = true

[tool.poetry.dependencies.turu-postgres]
# INFO: poetry-dynamic-versioning to replace this.
path = "./turu-postgres"
develop = true
# version = "0.0.0"
optional = true

[tool.poetry.dependencies.turu-snowflake]
# INFO: poetry-dynamic-versioning to replace this.
path = "./turu-snowflake"
develop = true
# version = "0.0.0"
optional = true

[tool.poetry.dependencies.turu-bigquery]
# INFO: poetry-dynamic-versioning to replace this.
path = "./turu-bigquery"
develop = true
# version = "0.0.0"
optional = true

[tool.poetry.group.dev.dependencies]
pytest = [
    { version = "^8.4.2", python = "<3.10" },
    { version = "^9.1.1", python = ">=3.10" },
]
taskipy = "^1.14.1"
pyright = "1.1.411"
ruff = "^0.15.21"
pydantic = "^2.13.4"
pytest-cov = "^7.1.0"
pytest-asyncio = [
    { version = "^1.2.0", python = "<3.10" },
    { version = "^1.4.0", python = ">=3.10" },
]
pytest-xdist = "^3.8.0"
pandera = [
    { version = ">=0.26.1", python = "<3.10" },
    { version = ">=0.32.1", python = ">=3.10" },
]
typing-extensions = "^4.16.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = { extras = ["imaging"], version = "^9.7.6" }
mkdocs-plugin-inline-svg = "^0.1.0"
mkdocs-exclude = "^1.0.2"
mkdocstrings = [
    { extras = ["python"], version = "^0.30.1", python = "<3.10" },
    { extras = ["python"], version = "^1.0.6", python = ">=3.10" },
]
griffe = [
    { version = "^1.14.0", python = "<3.10" },
    { version = "^2.1.0", python = ">=3.10" },
]
griffe-inherited-docstrings = [
    { version = "^1.1.2", python = "<3.10" },
    { version = "^1.1.3", python = ">=3.10" },
]
mkdocs-awesome-pages-plugin = "^2.10.1"

[tool.poetry-dynamic-versioning]
enable = false

[[tool.poetry-dynamic-versioning.substitution.folders]]
path = "."
files = ["pyproject.toml"]
patterns = [
    "path = \"\\./turu-[\\w-]+\"\ndevelop = true\n# (version = \"())0\\.0\\.0",
]

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright src/** tests/**"
test = "pytest ./tests -n auto --cov=src --cov-report=term --cov-report=xml"
ci = "task format && task lint && task typecheck && task test"
docs-serve = "mkdocs serve"
docs-deploy = "mkdocs gh-deploy"


[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
