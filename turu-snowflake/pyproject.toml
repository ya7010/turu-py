[project]
name = "turu-snowflake"
version = "0.1.0"
description = "Snowflake adapter for turu"
readme = "README.md"
requires-python = ">=3.9,<4"
authors = [{ name = "yassun7010", email = "yassun7010@outlook.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "snowflake-connector-python>=3.6.0",
  "turu-core>=0.1.0",
  "typing-extensions>=4.16.0,<5",
]

[project.urls]
Repository = "https://github.com/ya7010/turu-py"

[project.optional-dependencies]
pandas = ["pandas>=2.2.3", "pyarrow>=18.0.0"]
pandera = [
  "pandera>=0.26.1; python_version < '3.10'",
  "pandera>=0.32.1; python_version >= '3.10'",
]

[dependency-groups]
dev = [
  "numpy",
  "pandas-stubs",
  "pyarrow-stubs",
  "pydantic",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "taskipy",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turu"]

[tool.pyright]
reportOverlappingOverload = "none"

[tool.taskipy.tasks]
ci = "task format && task lint && task typecheck && task test"
format = "ruff format ."
lint = "ruff check ."
test = "pytest -n auto --cov=src --cov-report=term --cov-report=xml tests"
typecheck = "pyright src/** tests/**"

[tool.uv.sources]
turu-core.workspace = true
