[project]
name = "turu-core"
version = "0.1.0"
description = "Core components for turu"
authors = [{ name = "yassun7010", email = "yassun7010@outlook.com" }]
readme = "README.md"
requires-python = ">=3.9,<4"
dependencies = ["typing-extensions>=4.8.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/ya7010/turu-py"

[project.optional-dependencies]
pydantic = ["pydantic>=2.0.0"]

[dependency-groups]
dev = [
    "taskipy>=1.14.1,<2",
    "pyright==1.1.411",
    "ruff>=0.15.21,<0.16",
    "pytest>=8.4.2,<9; python_version < '3.10'",
    "pytest>=9.1.1,<10; python_version >= '3.10'",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.2.0,<2; python_version < '3.10'",
    "pytest-asyncio>=1.4.0,<2; python_version >= '3.10'",
    "pydantic>=2.13.4,<3",
]

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright src/** tests/**"
test = "pytest --cov=src --cov-report=term --cov-report=xml"
ci = "task format && task lint && task typecheck && task test"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turu"]
