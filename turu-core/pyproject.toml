[project]
name = "turu-core"
version = "0.1.0"
description = "Core components for turu"
readme = "README.md"
requires-python = ">=3.9,<4"
authors = [{ name = "yassun7010", email = "yassun7010@outlook.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["typing-extensions>=4.16.0,<5"]

[project.urls]
Repository = "https://github.com/ya7010/turu-py"

[project.optional-dependencies]
pydantic = ["pydantic>=2.13.4,<3"]

[dependency-groups]
dev = [
  "pydantic",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "taskipy",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turu"]

[tool.taskipy.tasks]
ci = "task format && task lint && task typecheck && task test"
format = "ruff format ."
lint = "ruff check ."
test = "pytest --cov=src --cov-report=term --cov-report=xml"
typecheck = "pyright src/** tests/**"
