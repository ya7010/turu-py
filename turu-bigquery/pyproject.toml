[project]
name = "turu-bigquery"
version = "0.1.0"
description = "BigQuery adapter for turu"
readme = "README.md"
requires-python = ">=3.9,<4"
authors = [{ name = "yassun7010", email = "yassun7010@outlook.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "google-cloud-bigquery",
  "pyarrow",
  "turu-core",
  "typing-extensions",
]

[project.urls]
Repository = "https://github.com/ya7010/turu-py"

[project.optional-dependencies]
bigquery-storage = ["google-cloud-bigquery-storage"]

[dependency-groups]
dev = [
  "numpy",
  "pydantic",
  "pyright",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "taskipy",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turu"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:tests",
  "ignore::UserWarning:google.cloud.bigquery",
  "ignore::DeprecationWarning:google.cloud.bigquery",
]

[tool.taskipy.tasks]
ci = "task format && task lint && task typecheck && task test"
format = "ruff format ."
lint = "ruff check ."
test = "pytest -n auto --cov=src --cov-report=term --cov-report=xml"
typecheck = "pyright src/** tests/**"

[tool.uv.sources]
turu-core.workspace = true
